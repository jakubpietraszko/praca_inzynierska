@if(models.length > 0) {
<mat-tab-group color="primary" [selectedIndex]="selectedModelIndex"
    (selectedIndexChange)="onLabelTabChange($event)"
>
    @for(model of models; track model; let i = $index) {
    <mat-tab [label]="model">
        <div class="model-layers">
            <h3>Layers for {{ model }}</h3>
            @if(modelLayers[model]) {
                <ul>
                    @for(layer of modelLayers[model]; track $index) {
                        <li>{{ layer }}</li>
                    }
                </ul>
            } @else {
                <p>Loading layers...</p>
            }
        </div>
    </mat-tab>
    }
</mat-tab-group>
} @else {
<p>Brak modeli</p>
}
