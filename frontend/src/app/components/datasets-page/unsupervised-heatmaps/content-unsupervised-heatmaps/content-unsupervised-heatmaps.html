@if (response()) {
  <ng-template #imageTemplate let-coord let-i="index">
    <img
      appLoadModelsDatasetsImage
      appZoomImage
      [dataset]="dataset()!"
      [label]="label()!"
      [filename]="coord.filename"
      [model]="model()!"
      [type]="heatmap()!"
      alt="{{ label() }} - {{ coord.filename }}"
      draggable="false"
    />
  </ng-template>

  <app-generic-unsupervised 
    [coordinates]="coordinates()"
    [imageTemplate]="imageTemplate"
  />
}
