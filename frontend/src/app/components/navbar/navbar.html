<mat-toolbar color="primary">
  <button
    mat-button
    routerLink="/home"
    #rlaHome="routerLinkActive"
    routerLinkActive
    [routerLinkActiveOptions]="{ exact: true }"
    [color]="rlaHome.isActive ? 'accent' : undefined"
  >
    Strona główna
  </button>
  <button
    mat-button
    routerLink="models"
    #rlaModels="routerLinkActive"
    routerLinkActive
    [routerLinkActiveOptions]="{ exact: true }"
    [color]="rlaModels.isActive ? 'accent' : undefined"
  >
    Modele
  </button>
  <button
    mat-button
    routerLink="/datasets"
    #rlaDatasets="routerLinkActive"
    routerLinkActive
    [routerLinkActiveOptions]="{ exact: true }"
    [color]="rlaDatasets.isActive ? 'accent' : undefined"
  >
    Zbiory danych
  </button>
  <button
    mat-button
    routerLink="/generator"
    #rlaGeneration="routerLinkActive"
    routerLinkActive
    [routerLinkActiveOptions]="{ exact: true }"
    [color]="rlaGeneration.isActive ? 'accent' : undefined"
  >
    Generator
  </button>
  <button
    mat-button
    routerLink="/settings"
    #rlaSettings="routerLinkActive"
    routerLinkActive
    [routerLinkActiveOptions]="{ exact: true }"
    [color]="rlaSettings.isActive ? 'accent' : undefined"
  >
    Ustawienia Generatora
  </button>
  <button
    mat-button
    routerLink="/statistics"
    #rlaStatistics="routerLinkActive"
    routerLinkActive
    [routerLinkActiveOptions]="{ exact: true }"
    [color]="rlaStatistics.isActive ? 'accent' : undefined"
  >
    Statystyki
  </button>
</mat-toolbar>
