<div class="image-container" #container>
    @for (coord of imageCoordinates; track coord; let i = $index) {
    <div class="draggable-image" cdkDrag [cdkDragBoundary]="container" (cdkDragEnded)="onDragEnded($event, i)"
        [style.left.%]="coord.coordX * (100 - 6)" [style.top.%]="coord.coordY * (100 - 8)">
        <img appLoadActivationImage [dataset]="dataset" [label]="coord.label" [filename]="filename" [model]="model"
            [image]="coord.filename" alt="{{coord.label}} - {{coord.filename}}" draggable="false">
        <div class="drag-placeholder" *cdkDragPlaceholder></div>
    </div>
    }
</div>
