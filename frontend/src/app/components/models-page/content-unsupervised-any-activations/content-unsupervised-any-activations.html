@if (response()) {
  <div class="image-container" #container>
    @for (
      coord of response()!.label_filenames_coords;
      track coord;
      let i = $index
    ) {
      <div
        class="draggable-image"
        cdkDrag
        [cdkDragBoundary]="container"
        [style.left.%]="coord.coordX * (100 - 6)"
        [style.top.%]="coord.coordY * (100 - 8)"
      >
        <img
          appLoadAnyActivationsImage
          appZoomImage
          [dataset]="dataset()!"
          [label]="coord.label"
          [filename]="filename()!"
          [model]="model()!"
          [image]="coord.filename"
          [ref]="ref()!"
          alt="{{ coord.label }} - {{ coord.filename }}"
          draggable="false"
        />
        <div class="drag-placeholder" *cdkDragPlaceholder></div>
      </div>
    }
  </div>
}
