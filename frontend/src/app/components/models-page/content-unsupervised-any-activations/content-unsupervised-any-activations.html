@if (response()) {
  <ng-template #imageTemplate let-coord let-i="index">
    <img
      appLoadAnyActivationsImage
      appZoomImage
      [dataset]="dataset()!"
      [label]="coord.label"
      [filename]="filename()!"
      [model]="model()!"
      [image]="coord.filename"
      [ref]="ref()!"
      alt="{{ coord.label }} - {{ coord.filename }}"
      draggable="false"
    />
  </ng-template>

  <app-generic-unsupervised 
    [coordinates]="coordinates()"
    [imageTemplate]="imageTemplate"
  />
}
