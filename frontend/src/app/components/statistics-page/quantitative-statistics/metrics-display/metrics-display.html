<div class="metrics-grid">
  <mat-card class="metric-card">
    <mat-card-header>
      <mat-card-title>Precyzja</mat-card-title>
      <mat-card-title>({{ type() }})</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="metric-value">{{ precision() | percent: "1.2-2" }}</div>
    </mat-card-content>
  </mat-card>

  <mat-card class="metric-card">
    <mat-card-header>
      <mat-card-title>Czułość</mat-card-title>
      <mat-card-title>({{ type() }})</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="metric-value">{{ recall() | percent: "1.2-2" }}</div>
    </mat-card-content>
  </mat-card>

  <mat-card class="metric-card">
    <mat-card-header>
      <mat-card-title>F1</mat-card-title>
      <mat-card-title>({{ type() }})</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="metric-value">{{ f1() | percent: "1.2-2" }}</div>
    </mat-card-content>
  </mat-card>

  <mat-card class="metric-card">
    <mat-card-header>
      <mat-card-title>Jaccard</mat-card-title>
      <mat-card-title>({{ type() }})</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="metric-value">{{ jaccard() | percent: "1.2-2" }}</div>
    </mat-card-content>
  </mat-card>

  <mat-card class="metric-card">
    <mat-card-header>
      <mat-card-title>ROC AUC</mat-card-title>
      <mat-card-title>({{ type() }})</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="metric-value">{{ rocAuc() | percent: "1.2-2" }}</div>
    </mat-card-content>
  </mat-card>
</div>
