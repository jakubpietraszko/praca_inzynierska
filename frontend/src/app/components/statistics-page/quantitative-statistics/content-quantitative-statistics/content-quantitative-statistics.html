@if (statisticsResponse()) {
  <div class="statistics-container">
    <app-overall-metrics 
      [accuracy]="accuracy()" 
      [balancedAccuracy]="balancedAccuracy()"
    />

    <app-metrics-display
      [type]="'Macro'"
      [precision]="precisionMacro()"
      [recall]="recallMacro()"
      [f1]="f1Macro()"
      [jaccard]="jaccardMacro()"
      [rocAuc]="rocAucMacro()"
    />

    <app-metrics-display
      [type]="'Micro'"
      [precision]="precisionMicro()"
      [recall]="recallMicro()"
      [f1]="f1Micro()"
      [jaccard]="jaccardMicro()"
      [rocAuc]="rocAucMicro()"
    />

    <app-metrics-display
      [type]="'Weighted'"
      [precision]="precisionWeighted()"
      [recall]="recallWeighted()"
      [f1]="f1Weighted()"
      [jaccard]="jaccardWeighted()"
      [rocAuc]="rocAucWeighted()"
    />

    <app-class-metrics-table [classMetrics]="classMetrics()" />

    @if (confusionMatrix()) {
      <app-confusion-matrix [confusionMatrix]="confusionMatrix()!" />
    }
  </div>
} @else {
  <div class="loading-container">
    <mat-progress-spinner [mode]="'indeterminate'"></mat-progress-spinner>
  </div>
}
