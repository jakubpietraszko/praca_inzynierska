<app-generic-selector
  [model]="true"
  [dataset]="true"
  [heatmap]="true"
  [(selectedModel)]="selectedModel"
  [(selectedDataset)]="selectedDataset"
  [(selectedHeatmap)]="selectedHeatmap"
></app-generic-selector>

@if (allSelected()) {
  <app-content-heatmaps-statistics-dataset
    [model]="selectedModel()!"
    [dataset]="selectedDataset()!"
    [heatmap]="selectedHeatmap()!"
  ></app-content-heatmaps-statistics-dataset>
}
