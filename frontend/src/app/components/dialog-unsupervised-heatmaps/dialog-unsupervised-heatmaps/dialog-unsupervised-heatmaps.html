<div>
    <app-model-selector [(selectedModel)]="selectedModel"></app-model-selector>
    <app-heatmaps-selector [(selectedHeatmap)]="selectedHeatmap"></app-heatmaps-selector>
</div>

@if(isAllDataSelected()) {
    <app-unsupervised-heatmaps
        [model]="selectedModel()"
        [heatmap]="selectedHeatmap()"
        [dataset]="dataset()"
        [label]="label()"
    ></app-unsupervised-heatmaps>
}
