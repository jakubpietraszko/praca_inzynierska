<app-model-selector
    [(selectedModel)]="selectedModel"
></app-model-selector>

@if(selectedModel()) {
    <app-unsupervised-activations
        [model]="selectedModel()!"
        [dataset]="data.dataset"
        [label]="data.label"
        [filename]="data.filename"
        [type]="'tsne'" 
    ></app-unsupervised-activations>
}
