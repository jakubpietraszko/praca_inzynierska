networks:
  my_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

services:
  backend:
    container_name: backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    networks:
      my_network:
        ipv4_address: 172.28.0.3
    ports:
      - "8001:8000"
    volumes:
      - ./DIR:/app/DIR
    
  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      my_network:
        ipv4_address: 172.28.0.2
    ports:
      - "8000:80"

  dir-handler:
    container_name: dir-handler
    build:
      context: ./dir-handler
      dockerfile: Dockerfile
    networks:
      my_network:
        ipv4_address: 172.28.0.4
    ports:
      - "8002:8000"
    volumes:
      - ./DIR:/app/DIR