networks:
  my_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

services:
  backend:
    container_name: backend2
    build:
      context: ./backend2
      dockerfile: Dockerfile
    networks:
      my_network:
        ipv4_address: 172.28.0.3
    ports:
      - "8001:8000"
    volumes:
      - ./DIR:/app/DIR
    environment:
      - APP_ENV=production
    
  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      my_network:
        ipv4_address: 172.28.0.2
    ports:
      - "8000:80"